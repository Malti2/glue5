# Builds the app for one platform, by hand (Actions > Build > Run workflow),
# from the game.wasm in a draft release of this repository, and puts the
# result into that draft: nothing built from the game is published. Meant
# for forks: see docs/github-build.md.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, windows, macos, linux-x86_64, linux-aarch64]
        default: ios

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON('{"ios":"macos-26","macos":"macos-26","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2025"}')[inputs.platform] }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The tools each platform needs are installed below, not all of them.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v5

      # Fork variant: the web upload limit is 25 MB, so game.wasm (63 MB)
      # lives in the draft as Glue5-game.wasm.part1..3 (the Glue5- prefix
      # keeps them covered by the release guard) and is reassembled here;
      # its sha256 must match the supported build.
      - name: game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          # Windows: D:/a/_temp/game, a path for Git's bash and for cargo alike.
          if [ "$RUNNER_OS" = Windows ]; then game=$(cygpath -m "$game"); fi
          .github/scripts/draft.sh guard || exit 1
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" | jq -c '[.[][] | select(.draft) | select(.assets != null and any(.assets[]; .name | startswith("Glue5-game.wasm.part")))] | sort_by(.created_at) | last // empty')
          [ -n "$release" ] || { echo "::error::No draft release with Glue5-game.wasm.part1..3"; exit 1; }
          id=$(jq -r .id <<<"$release")
          mkdir -p "$game/b/8b0b5899ed"
          for part in 1 2 3; do
            asset=$(jq -r --arg n "Glue5-game.wasm.part$part" '[.assets[] | select(.name == $n) | .id] | if length == 1 then .[0] else empty end' <<<"$release")
            [ -n "$asset" ] || { echo "::error::The draft has no single asset Glue5-game.wasm.part$part"; exit 1; }
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$asset" >> "$game/b/8b0b5899ed/game.wasm"
          done
          sum=$(sha256sum "$game/b/8b0b5899ed/game.wasm" 2>/dev/null || shasum -a 256 "$game/b/8b0b5899ed/game.wasm"); sum=${sum%% *}
          [ "$sum" = "11ca8d2c04c5e843d18ff4aea4899d72c86973c6b031df334e67c446b2ae83e0" ] || { echo "::error::reassembled game.wasm sha256 $sum does not match the supported build"; exit 1; }
          echo "game.wasm reassembled from 3 parts: build 8b0b5899ed"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"
          echo "release=$id" >>"$GITHUB_OUTPUT"

      # Windows: the tasks run in Git's bash (see the README's Windows
      # section); Visual Studio and LLVM's clang-cl come with the machine.
      - name: Git's bash for mise
        if: runner.os == 'Windows'
        run: echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >>"$GITHUB_ENV"

      - name: Room on the disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@v2
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      # The APK's key, kept in the draft: an update signed with another one
      # would have to replace the app, and that deletes its game folder.
      - name: Android signing key
        if: inputs.platform == 'android'
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          cd ~/.android && "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then mv Glue5-android.keystore debug.keystore; fi

      - name: Build
        run: |
          case $PLATFORM in
          ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;
          windows)
              mise run build
              mv target/release/glue5.exe Glue5-windows.exe
              ;;
          macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;
          android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp ~/.android/debug.keystore Glue5-android.keystore
              ;;
          linux-*)
              mise run linux:container "${PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$PLATFORM.AppImage"
              ;;
          esac

      - name: Into the draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*
          echo "Built for $PLATFORM: the files are in the draft release, under $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (keep it a draft)." >>"$GITHUB_STEP_SUMMARY"
